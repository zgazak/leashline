# Leashline local config — for running on your own machine.
# Uses SQLite, no auth. MQTT credentials come from secrets/prod.yaml.

host: "0.0.0.0"
port: 8000
secrets_path: "../../../../secrets/prod.yaml"

storage:
  backend: "sqlite"
  sqlite:
    path: "leashline.db"

meshtastic:
  connection_type: "mqtt"
  serial_port: "/dev/ttyUSB0"
  tcp_host: "localhost"
  tcp_port: 4403
  ble_address: null

mqtt:
  broker_host: ""              # overridden by secrets/prod.yaml
  broker_port: 8883
  username: ""
  password: ""
  topic: "leashline/+/2/json/#"
  tls_enabled: true
  ca_certs: "resources/certs/emqxsl-ca.crt"

detection:
  warning_buffer_m: 20.0
  breach_confirm_s: 10.0
  scatter_threshold_m: 50.0
  max_history: 20

auth:
  enabled: false

notifications:
  enabled: false
