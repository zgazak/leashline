[project]
name = "leashline"
authors = [
  { name="Zach", email="zach@leashline.io" },
]
version = "0.1.1"
description = "local-first dog escape detection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE*"]
dependencies = []

[dependency-groups]
dev = [
    "build>=1.4.0",
    "twine>=6.2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24.0",
    "genbadge[coverage,tests]>=1.1",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leashline"]

[project.urls]
Homepage = "https://github.com/zgazak/leashline"
Issues = "https://github.com/zgazak/leashline/issues"

[tool.uv.workspace]
members = ["app", "engine", "resources"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
