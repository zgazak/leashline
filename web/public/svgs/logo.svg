<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="512" height="512" fill="#90CDF4"/>
    
    <!-- Dog Group -->
    <g id="dog-icon">
        <!-- Ears (positioned behind head) -->
        <g id="ears">
            <rect x="96" y="160" width="100" height="180" rx="50" transform="rotate(-20 146 160)" fill="#9F7251"/>
            <rect x="316" y="160" width="100" height="180" rx="50" transform="rotate(20 366 160)" fill="#9F7251"/>
        </g>

        <!-- Main Head Shape -->
        <rect x="146" y="140" width="220" height="260" rx="110" fill="#C89B7B"/>

        <!-- Snout/Muzzle Patch area -->
        <ellipse cx="256" cy="325" rx="85" ry="65" fill="#E8D3C1"/>

        <!-- Nose -->
        <rect x="224" y="295" width="64" height="45" rx="22.5" fill="#5D4037"/>

        <!-- Eyes -->
        <ellipse cx="206" cy="250" rx="18" ry="22" fill="#5D4037"/>
        <ellipse cx="306" cy="250" rx="18" ry="22" fill="#5D4037"/>
        
        <!-- Eye Highlights (for extra cuteness) -->
        <circle cx="214" cy="242" r="6" fill="white" fill-opacity="0.7"/>
        <circle cx="314" cy="242" r="6" fill="white" fill-opacity="0.7"/>

        <!-- Mouth -->
        <path d="M256 340 C 256 340, 226 385, 196 370" stroke="#5D4037" stroke-width="12" stroke-linecap="round"/>
        <path d="M256 340 C 256 340, 286 385, 316 370" stroke="#5D4037" stroke-width="12" stroke-linecap="round"/>
    </g>
</svg>