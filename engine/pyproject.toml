[project]
name = "engine"
version = "1.0.0"
description = "Leashline detection engine — geofencing, escape detection, GPS analysis"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
